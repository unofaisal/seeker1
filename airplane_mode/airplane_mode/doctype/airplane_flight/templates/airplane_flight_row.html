<div style="border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px;">
    <strong>{{ frappe.db.get_value("Airplane", doc.airplane, "airline") }}</strong>
    <div>{{ doc.source_airport_code }} &rarr; {{ doc.destination_airport_code }}</div>
    <div>
        {{ frappe.utils.format_date(doc.date_of_departure, "d MMMM, YYYY") }} |
        {{ doc.time_of_departure }} |
        {{ frappe.utils.format_duration(doc.duration) }}
    </div>
    <a href="/{{ doc.route }}">View Flight</a>
</div>
